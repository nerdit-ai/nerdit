name: Bug report
description: Something is broken or behaving unexpectedly.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug. Please **do not** file
        security vulnerabilities here — see
        [GitHub Security Advisories](https://github.com/nerdit-ai/nerdit/security/advisories/new)
        for private reporting instructions instead.

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the bug.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Nerdit version
      description: Output of `nerdit --version`.
      placeholder: "0.5.0"
    validations:
      required: true

  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: "Ubuntu 24.04 / macOS 15 / WSL2 (Ubuntu 24.04)"
    validations:
      required: true

  - type: dropdown
    id: install-method
    attributes:
      label: How did you install Nerdit?
      options:
        - Installer script (install.sh)
        - pip
        - From source
        - Other / not sure
    validations:
      required: true

  - type: textarea
    id: doctor
    attributes:
      label: nerdit doctor output
      description: |
        Run `nerdit doctor` and paste the full output. It reports **key
        names only, never secret values** — it is safe to paste as-is.
      render: text
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant service logs
      description: |
        If this involves a deployed app or model, attach the relevant
        output of `nerdit logs <service>` (or `nerdit logs <service>
        --tail 200`). Please redact anything you don't want public —
        logs can echo request paths or environment values your app
        itself printed.
      render: text

  - type: textarea
    id: extra
    attributes:
      label: Anything else?
      description: Steps to reproduce, screenshots, config snippets, etc.
