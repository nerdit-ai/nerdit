[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "nerdit"
version = "0.6.1"
description = "The local AI PaaS — deploy and operate apps on your own hardware, with first-class local AI"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
keywords = [
    "paas",
    "self-hosted",
    "local-ai",
    "docker",
    "ollama",
    "deploy",
    "gpu",
    "mcp",
]
# Rendered on the PyPI project page (open-source plan §3 Q7 (d)) — the first
# upload of the new line is what rebrands a project page still describing the
# pre-pivot orchestrator. Deliberately NO "License :: ..." classifier: PEP 639
# deprecates the license classifiers in favour of the `license` expression
# above, and hatchling rejects carrying both.
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Build Tools",
    "Topic :: System :: Systems Administration",
]
dependencies = [
    # Explicit, not transitive-via-starlette: the idempotency middleware relies
    # on ``anyio.CancelScope(shield=True)`` for its cancel-safe cleanup (P22).
    "anyio>=4",
    "typer[all]>=0.12",
    "rich>=13.0",
    # Floor pinned by D-P22-7: the idempotency middleware reads the request body
    # pre-``call_next`` and relies on Starlette's ``_CachedRequest`` replaying it
    # to the router. Older resolutions do not guarantee that.
    "fastapi>=0.139",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "pynvml>=11.5",
    "docker>=7.0",
    "aiosqlite>=0.20",
    "pydantic>=2.7",
    "sse-starlette>=2.0",
    "python-multipart>=0.0.9",
    "tomli-w>=1.0",
    "cryptography>=42",
    # P25 D-P25-6 (owner-countersigned): ``[deploy].edge_auth`` passwords are
    # bcrypt-hashed at route-build time and only the hash rides the Caddy admin
    # API. Caddy's ``http_basic`` verifies bcrypt natively; hashing in-process
    # beats shelling out to ``caddy hash-password`` (which would hand the
    # plaintext to a subprocess and couple validation to the proxy binary).
    "bcrypt>=4",
    # P27 WP-C1: the node-link tunnel client dials the relay with
    # ``websockets.asyncio.client.connect``. Present transitively via
    # ``uvicorn[standard]``, but imported directly here, so the floor is
    # explicit — the ``anyio>=4`` precedent. ``>=14`` matches the cloud's own
    # pin: its relay and reference client are built on the same
    # ``websockets.asyncio`` API, and matching it keeps close-code and
    # upgrade-rejection semantics identical on both ends of the frozen wire.
    "websockets>=14",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5",
    "ruff>=0.4",
    "mypy>=1.10",
    "pre-commit>=3.7",
]
docs = [
    "mkdocs>=1.6",
    "mkdocs-material>=9.5",
    "mkdocstrings[python]>=0.27",
]
mcp = [
    "mcp>=1.9,<2",
]
mdns = [
    "zeroconf>=0.132",
]

[project.scripts]
nerdit = "nerdit.cli.app:main"
nerditd = "nerdit.daemon.server:main"

# Every link points at the public repo (`nerdit-ai/nerdit`), which is where
# the source is published and where a PyPI visitor can actually follow it.
[project.urls]
Homepage = "https://github.com/nerdit-ai/nerdit"
Repository = "https://github.com/nerdit-ai/nerdit"
Issues = "https://github.com/nerdit-ai/nerdit/issues"
Changelog = "https://github.com/nerdit-ai/nerdit/blob/main/CHANGELOG.md"

[tool.hatch.build]
# The dashboard bundle is gitignored and built in CI before hatch/pyinstaller
# run, and hatchling skips VCS-ignored paths — so without this the wheel ships
# without the SPA and a non-editable install serves the 503 fallback. `artifacts`
# (not force-include) is the right lever: it includes the path when it is there
# and is silent when it is not, so a dist-less dev or CI install stays valid.
artifacts = ["src/nerdit/daemon/web/dist"]

# The sdist is an ALLOWLIST, never hatchling's default of "every tracked file":
# this tree is the private development repo, and the default would ship the
# planning layer, the private runbooks, the hosting layout and the CI files —
# everything scripts/publish_public.sh deliberately keeps out of the public
# mirror — inside a tarball PyPI never deletes. LICENSE and NOTICE are laid
# down from packaging/public/ by the publish workflow before the build (a
# missing entry here is silently skipped, so a dev build without them still
# works). The publish workflow re-checks the built sdist against this set.
[tool.hatch.build.targets.sdist]
only-include = ["src/nerdit", "pyproject.toml", "README.md", "LICENSE", "NOTICE"]

[tool.hatch.build.targets.wheel]
packages = ["src/nerdit"]

[tool.hatch.build.targets.wheel.force-include]
"src/nerdit/config/app_templates/builtin.json" = "nerdit/config/app_templates/builtin.json"
# NOTE: daemon/web/dist is deliberately NOT force-included: it comes in through
# the `artifacts` entry above. Force-including it as well makes the wheel build
# fail with "A second file is being added at the same path".

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "N",
    "W",
    "B",       # flake8-bugbear
    "C901",    # mccabe complexity
    "PLR0912", # too many branches
    "PLR0913", # too many arguments
    "PLR0915", # too many statements
    "SIM",     # flake8-simplify
    "RET",     # flake8-return
]

[tool.ruff.lint.mccabe]
max-complexity = 15

[tool.ruff.lint.pylint]
max-args = 6

[tool.ruff.lint.flake8-bugbear]
# Typer/FastAPI parameter factories are declarative metadata, not mutable
# defaults. This is a permanent exemption, not debt: it keeps B008 live for
# genuine mutable defaults in the same files (19 findings today are all of
# this shape — typer.Option/typer.Argument, fastapi Body/File/Query).
extend-immutable-calls = [
    "typer.Option",
    "typer.Argument",
    "fastapi.Body",
    "fastapi.File",
    "fastapi.Form",
    "fastapi.Query",
    "fastapi.Depends",
]

# ---------------------------------------------------------------------------
# Ratchet ledger: every entry freezes exactly the rules a file trips TODAY, so
# the rules are real gates for new and edited code while the backlog is worked
# off. Rules NOT listed for a file are enforced there.
#
# Every entry is one of two kinds, named by its trailing comment:
#   - a WP reference (e.g. "WP18 — split into views/purge/wait/diagnose") means
#     a scheduled work package reshapes or deletes the offending code; delete
#     the entry the moment that WP lands — a stale entry is a hole in the gate.
#   - "idiom — <reason>" means the finding is a deliberate, load-bearing
#     pattern (a suppressed race, a wide argument list mirroring an API/CLI
#     surface, a linear wizard/dispatch ladder, …) with no WP scheduled to
#     touch it; these are not silent permanent exemptions — re-open the
#     backlog if one becomes fixable.
# Both counts are re-derived against a real no-ledger `ruff check` run before
# any entry is trusted — do not hand-copy an old count.
# ---------------------------------------------------------------------------
[tool.ruff.lint.per-file-ignores]

