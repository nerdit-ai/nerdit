[tool.ruff.format]
# ruff 0.16 formats Python code blocks inside Markdown by default; the code
# blocks in this repository's Markdown are illustrative specs with hand-aligned
# comment columns — keep the formatter off Markdown entirely.
exclude = ["*.md"]

[tool.mypy]
# The gate is `mypy src/nerdit` and it must exit 0, so a NEW type error fails
# CI. Everything still broken today is suppressed *narrowly* below — per module,
# per error code — and every entry names the WP that removes it. Do not add a
# blanket `ignore_errors`, and do not widen an entry without a WP reference.
#
# `src/nerdit`, not `src/`: with namespace_packages off, pointing mypy at `src/`
# risks crawling the un-`__init__`'d `src/nerdit/daemon/web` tree.
python_version = "3.11" # declared floor; the dev venv is newer
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "hardware: requires real hardware (GPU, or a full daemon subprocess against real Docker)",
    "integration: full-daemon subprocess integration test",
]
